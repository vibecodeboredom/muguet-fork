name: Fetch game data parts

# Downloads the 14 playgta5 game-data parts one per job, so no single
# runner ever has to hold the whole ~21 GB game. Each job fetches its
# part (~1.5 GB), verifies the checksum, extracts it with the
# mirror/playgta5.com/ prefix stripped, and uploads the clean files as
# an artifact named game-data-part-NN.
#
# This does NOT produce a playable game by itself: the phone's importer
# wants ONE complete zip (data/manifest.json + shaders). To finish, take
# the 14 artifacts, extract them all into ONE folder (needs ~45 GB free
# somewhere — a PC, not the runner), zip that folder up, put the zip on
# the phone, and use the app's "Import game data .zip" button.
# Run this manually from the Actions sidebar; it never runs on push.
# Artifacts expire after 7 days.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: "01"
            sha256: 343823558ae497201db673fbc40e496b3db440f1dbdfaab40da1a0766759854f
          - part: "02"
            sha256: 68fdcdafdd34dec78d4838d6fdab3c4318fca6f4c88ad9ca36b42be9af8f6b1f
          - part: "03"
            sha256: fca4cf0f7395c0379b4ecbf3537d637409e53d7d068fdbebdc08c6c339c13b27
          - part: "04"
            sha256: 50d88451cfa05864d016f9c91498eea23e7ee7bc2dd708ef76046fba6435e5da
          - part: "05"
            sha256: 1781a085e99be700c64bccff7f49c113ac7a4e7eb9b19565b50d9b004a9a8005
          - part: "06"
            sha256: 697f945061854d6049b635a49b92e7128887b59888a3156d1d8acf3abc2b7fbc
          - part: "07"
            sha256: 097bf1dc28ec5baa60d4618a053d13985d5c658b85fbcd71e621c758e7d3664b
          - part: "08"
            sha256: 0d735c2d41f99a1963d253379f2f8f86231f326906616471fe27cae9263d7ae4
          - part: "09"
            sha256: 0b648ac9aad1880a0f18c2f09b0e2fcf0113781f2403901619449908cdcee6f8
          - part: "10"
            sha256: 44485af17cf924ba2f8199502089e26582cfe7d3bb8be4b5592485bc793015c1
          - part: "11"
            sha256: da4356a340b8e26e2d4ec3f72d39453b733aba22f2557ff5e0afc5416223e317
          - part: "12"
            sha256: e1d368e82153d274ab37fb41b898f41fcc710d32678da6b0817217232ad068f1
          - part: "13"
            sha256: ab5be642a442fd2f2b1967a40d4e288dde4300d00b1a7a6860917976bb55324c
          - part: "14"
            sha256: 15b6b1c113d867325b034e5d5be03948fe22a5833d7335973ff1c0637547c744
    steps:
      - name: Download part
        run: |
          curl -L --fail -o "part-${{ matrix.part }}.zip" "https://github.com/alihammoud21/playgta5/releases/download/full-game-v1/playgta5-part-${{ matrix.part }}-of-14.zip"
          echo "${{ matrix.sha256 }}  part-${{ matrix.part }}.zip" | sha256sum -c -
          ls -lh "part-${{ matrix.part }}.zip"
          df -h .

      - name: Extract (strip mirror prefix)
        run: |
          mkdir -p raw out
          unzip -q "part-${{ matrix.part }}.zip" -d raw
          if [ -d raw/mirror/playgta5.com ]; then
            mv raw/mirror/playgta5.com/* out/
          else
            mv raw/* out/
          fi
          ls out/
          du -sh out
          rm -rf raw "part-${{ matrix.part }}.zip"

      - name: Upload part artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-data-part-${{ matrix.part }}
          path: out/
          if-no-files-found: error
          retention-days: 7
