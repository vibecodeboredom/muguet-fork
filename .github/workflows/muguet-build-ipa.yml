name: Build IPA

# Builds an unsigned (sideloadable) Muguet IPA with the upstream
# make-ios.sh script. Put this file in .github/workflows/ and run it
# from the Actions sidebar, or let it run on every push to main.
#
# Needs no Apple Developer account and no signing identity:
#   FREE=1 + --ipa  =>  sideload entitlements, ad-hoc codesign, no TEAM.
# Output: build/Muguet.ipa, uploaded as the "Muguet-IPA" artifact.
#
# Why this one shows up in Actions (last time's didn't):
# the `push` trigger below makes the workflow appear and run as soon as
# the file lands on main. workflow_dispatch-only workflows only show up
# in the sidebar after GitHub indexes them, which is flaky.
#
# Game code, automatically: by default the workflow downloads
# playgta5-part-01-of-14.zip (~1.5 GB) from the alihammoud21/playgta5
# "Full game v1" release and builds the IPA with the game code baked in.
# Only part 01 is needed — game.wasm (60 MB) and all the shaders live
# there; the other 13 parts are game data that make-ios.sh doesn't
# bundle, so you don't need 21 GB of storage anywhere. A custom
# game_url overrides the automatic download; uncheck fetch_playgta5
# (manual runs only) to build the app shell without game code.
#
# NOTE on the game source: a 21 GB full-game zip (e.g. a file host link)
# can NOT be the build input — the macOS runner only has ~13 GB free,
# and file hosts usually block automated downloads anyway. The build
# only ever needs game.wasm, which is inside part 01. The full game
# files are for the in-app data import on the phone, not the build.
#
# BUG FIX (v3, 2026-11-06): the v2 merge build (run 42088556746) went
# green but silently built the SHELL — its log says "no game zip given".
# Cause: on push events every `inputs.*` is null, and in GitHub
# expressions null == '' is FALSE, so the old fetch condition
# `inputs.fetch_playgta5 != false && inputs.game_url == ''` was false
# and the download step never ran. The conditions below now also accept
# null (`... || inputs.game_url == null`), so push builds fetch the
# game code like manual runs do.
#
# v4 (2026-11-06): v3 STILL skipped the download (run 42311982663,
# shell again, 2.1M) — because null == false in GitHub expressions,
# `inputs.fetch_playgta5 != false` is false on push too. Never compare
# a maybe-null input to false; the fetch condition now keys off the
# event name instead.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "iOS bundle identifier for the IPA"
        required: false
        default: "com.vibecodeboredom.muguet"
      game_url:
        description: "Optional direct URL to your own copy of the game files as a .zip (must contain b/<build>/game.wasm) or a bare game.wasm — overrides the automatic download. Leave empty to use the automatic download."
        required: false
        default: ""
      fetch_playgta5:
        description: "Download playgta5 part 01 automatically and build with game code"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

run-name: Build IPA (${{ inputs.bundle_id || 'com.vibecodeboredom.muguet' }})

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.vibecodeboredom.muguet' }}
      FREE: "1"
      PLAYGTA5_PART01_URL: https://github.com/alihammoud21/playgta5/releases/download/full-game-v1/playgta5-part-01-of-14.zip
      PLAYGTA5_PART01_SHA256: 343823558ae497201db673fbc40e496b3db440f1dbdfaab40da1a0766759854f
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          rustup --version || true

      - name: Install xcodegen
        # binaryen provides wasm-opt, which make-ios.sh uses to -O3 the
        # game code when a game file is given (skipped silently without it).
        run: brew install xcodegen binaryen

      - name: Install Rust 1.98.1 + iOS target
        run: |
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios
          cargo --version
          rustc --version

      - name: Download game code from URL (optional override)
        # inputs.game_url is null on push events (not ''), so the
        # `!= null` arm keeps this step skipped there.
        if: ${{ inputs.game_url != '' && inputs.game_url != null }}
        run: |
          # make-ios.sh picks its game path by extension (*.zip vs *.wasm),
          # so keep the real extension — saving a .wasm as game.zip would
          # make it try to unzip a wasm file and fail the build.
          case "${{ inputs.game_url }}" in
            *.wasm) GAME_FILE=game.wasm ;;
            *) GAME_FILE=game.zip ;;
          esac
          echo "GAME_FILE=$GAME_FILE" >> "$GITHUB_ENV"
          curl -L --fail -o "$GAME_FILE" "${{ inputs.game_url }}"
          ls -lh "$GAME_FILE"

      - name: Download playgta5 part 01 (automatic)
        # Only part 01 is needed: game.wasm and all shaders live there.
        # Runs on push AND on manual runs unless the box is unchecked.
        # Skipped when a custom game_url was given above.
        # v4: the push case is keyed off the event name, NOT off the
        # input — on push the input is null, and null == false in
        # GitHub expressions, so `inputs.fetch_playgta5 != false`
        # was false and v3 skipped this step too (run 42311982663).
        if: ${{ (github.event_name == 'push' || inputs.fetch_playgta5 == true) && (inputs.game_url == '' || inputs.game_url == null) }}
        run: |
          curl -L --fail -o game.zip "$PLAYGTA5_PART01_URL"
          echo "$PLAYGTA5_PART01_SHA256  game.zip" | shasum -a 256 -c -
          echo "GAME_FILE=game.zip" >> "$GITHUB_ENV"
          ls -lh game.zip
          df -h .

      - name: Build the IPA
        run: |
          chmod +x make-ios.sh
          if [ -n "$GAME_FILE" ] && [ -f "$GAME_FILE" ]; then
            ./make-ios.sh "$GAME_FILE" --ipa
          else
            ./make-ios.sh --ipa
          fi
          ls -lh build/Muguet.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: build/Muguet.ipa
          if-no-files-found: error
          retention-days: 30
